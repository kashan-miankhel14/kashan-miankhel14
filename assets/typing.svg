<svg xmlns="http://www.w3.org/2000/svg" width="900" height="120" viewBox="0 0 900 120" role="img" aria-labelledby="title">
  <title id="title">Engineering focus</title>
  <rect width="900" height="120" rx="12" fill="#0f172a"/>
  <rect x="1" y="1" width="898" height="118" rx="11" fill="none" stroke="#38bdf8" stroke-opacity="0.35"/>
  <text x="450" y="42" text-anchor="middle" font-family="monospace" font-size="20" font-weight="600" fill="#38bdf8">I build software from business workflow to production infrastructure.</text>
  <text x="450" y="75" text-anchor="middle" font-family="monospace" font-size="18" fill="#e2e8f0">Backend → Databases → Cloud → DevOps → AI → Systems</text>
  <text x="450" y="102" text-anchor="middle" font-family="monospace" font-size="16" fill="#94a3b8">Architecture • Reliability • Security • Shipping real things</text>
